name: Android Build

on:
  push:
    branches:
      - "claude/android-todo-app-*"
      - "main"
    paths:
      - "android-todo/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-todo/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-todo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show Gradle and Java versions
        run: |
          java -version
          ./gradlew --version

      - name: Compile Kotlin
        id: compile
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee /tmp/kotlin.log

      - name: Print last 200 lines of Kotlin log on failure
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          echo "::group::Last 200 lines of /tmp/kotlin.log"
          tail -n 200 /tmp/kotlin.log || true
          echo "::endgroup::"
          echo "::group::Grep for 'error:' in /tmp/kotlin.log"
          grep -nE "error:|e: " /tmp/kotlin.log || true
          echo "::endgroup::"

      - name: Upload Kotlin compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-compile-log
          path: /tmp/kotlin.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aufgaben-debug-apk
          path: android-todo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android-todo/app/build/reports/
            android-todo/app/build/outputs/logs/
            android-todo/build/reports/
          if-no-files-found: ignore
          retention-days: 14
