name: Android Build

on:
  push:
    branches:
      - "claude/android-todo-app-*"
      - "main"
    paths:
      - "android-todo/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-todo/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-todo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show Gradle and Java versions
        run: |
          java -version
          ./gradlew --version

      - name: Compile Kotlin (isolated, for clearer error reporting)
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Process resources (isolated, for clearer error reporting)
        run: ./gradlew :app:processDebugResources --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aufgaben-debug-apk
          path: android-todo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Print tail of all log/report files on failure
        if: failure()
        run: |
          set +e
          echo "::group::Find build outputs"
          find app/build -type f \( -name "*.txt" -o -name "*.xml" -o -name "*.log" \) 2>/dev/null | head -100
          echo "::endgroup::"
          for f in $(find app/build -type f \( -name "*.txt" -o -name "*.xml" -o -name "*.log" \) 2>/dev/null); do
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android-todo/app/build/reports/
            android-todo/app/build/outputs/logs/
            android-todo/build/reports/
          if-no-files-found: ignore
          retention-days: 14
