name: Android Build

on:
  push:
    branches:
      - "claude/android-todo-app-*"
      - "main"
    paths:
      - "android-todo/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android-todo/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-todo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-todo/**/*.gradle*', 'android-todo/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aufgaben-debug-apk
          path: android-todo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
